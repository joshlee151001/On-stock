<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>On-stock</title>
<meta name="theme-color" content="#FF9F43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="On-stock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF9F43'/%3E%3Cpath d='M12 44l12-12 9 8 18-20' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --primary: #FF9F43;
  --primary-deep: #E8801F;
  --primary-light: #FFF1E2;
  --up: #F04452;
  --down: #3182F6;
  --bg: #F7F4F0;
  --card: #FFFFFF;
  --text: #1F1A14;
  --sub: #857B70;
  --line: #EFE8DF;
  --input: #F5F1EC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17140F; --card: #221E18; --text: #F3EEE8; --sub: #A79C90; --line: #332D25; --input: #2C2720; --primary-light: #3A2A18;
  }
}
:root[data-theme="dark"] { --bg: #17140F; --card: #221E18; --text: #F3EEE8; --sub: #A79C90; --line: #332D25; --input: #2C2720; --primary-light: #3A2A18; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
input, textarea { font-family: inherit; font-size: 16px; color: var(--text); }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--sub); }

#app { position: fixed; inset: 0; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
@media (min-width: 600px) { #app { box-shadow: 0 0 40px rgba(0,0,0,0.08); } }

/* ---------- 공통 ---------- */
.topbar { height: calc(56px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 16px 0; display: flex; align-items: center; gap: 10px; background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.logo { display: flex; align-items: center; gap: 7px; font-weight: 900; font-size: 19px; letter-spacing: -0.3px; }
.logo .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--primary); display: flex; align-items: center; justify-content: center; }
.logo .mark svg { width: 20px; height: 20px; }
.logo b { color: var(--primary); }
.spacer { flex: 1; }
.pill { font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 20px; background: var(--input); color: var(--sub); white-space: nowrap; }
.pill.open { background: #FFE9EB; color: var(--up); }
.pill.auction { background: var(--primary-light); color: var(--primary-deep); }
.clock { font-size: 12px; color: var(--sub); font-weight: 700; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.icon-btn svg { width: 22px; height: 22px; }
.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }
.card { background: var(--card); border-radius: 20px; margin: 12px 14px 0; padding: 18px; }
.card h3 { font-size: 16px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.card h3 .spacer { flex: 1; }
.card h3 small { font-size: 12px; color: var(--sub); font-weight: 600; }
.btn { height: 52px; border-radius: 14px; background: var(--primary); color: #fff; font-size: 17px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.ghost { background: var(--primary-light); color: var(--primary-deep); }
.btn.gray { background: var(--input); color: var(--sub); }
.btn.buy { background: var(--up); }
.btn.sell { background: var(--down); }
.btn.block { width: 100%; }
.link { color: var(--primary-deep); font-weight: 700; font-size: 13px; }
.tabbar { display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
.tabbar button { flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--sub); font-weight: 700; position: relative; }
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button.on { color: var(--primary-deep); }
.tabbar .dot { position: absolute; top: 8px; right: calc(50% - 16px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--up); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.empty { text-align: center; color: var(--sub); padding: 26px 10px; font-size: 14px; line-height: 1.6; }
.viewer-bar { background: #3B2A18; color: #FFD9B0; text-align: center; font-size: 13px; font-weight: 700; padding: 8px; }

/* ---------- 로그인 ---------- */
#login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
.login-box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
.big-logo { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 18px; }
.big-logo .mark { width: 84px; height: 84px; border-radius: 26px; background: var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 30px rgba(255,159,67,0.4); }
.big-logo .mark svg { width: 54px; height: 54px; }
.big-logo h1 { font-size: 34px; font-weight: 900; letter-spacing: -1px; }
.big-logo h1 b { color: var(--primary); }
.big-logo p { color: var(--sub); font-size: 14px; text-align: center; line-height: 1.6; }
.field { height: 54px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); padding: 0 16px; outline: none; }
.field:focus { border-color: var(--primary); }
.login-msg { color: var(--up); font-size: 13px; text-align: center; min-height: 18px; line-height: 1.5; }
.login-sub { text-align: center; font-size: 13px; color: var(--sub); line-height: 1.6; }

/* ---------- 홈 (내 자산) ---------- */
.asset-total { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; margin-top: 4px; }
.asset-label { font-size: 13px; color: var(--sub); font-weight: 700; }
.asset-pl { font-size: 15px; font-weight: 800; margin-top: 4px; }
.asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.asset-grid div { background: var(--input); border-radius: 14px; padding: 12px; }
.asset-grid span { display: block; font-size: 12px; color: var(--sub); font-weight: 700; }
.asset-grid b { font-size: 16px; font-weight: 800; }
.mini-chart { width: 100%; height: 120px; display: block; margin-top: 12px; }

/* ---------- 종목 리스트 ---------- */
.stock-row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.stock-row:last-child { border-bottom: none; }
.stock-logo { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.stock-row .nm { flex: 1; min-width: 0; }
.stock-row .nm b { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stock-row .nm span { font-size: 12px; color: var(--sub); }
.stock-row .spark { width: 64px; height: 30px; flex-shrink: 0; }
.stock-row .px { text-align: right; min-width: 92px; }
.stock-row .px b { display: block; font-size: 15px; font-weight: 800; }
.stock-row .px span { font-size: 12px; font-weight: 700; }
.tick-flash-up { animation: fu 0.6s; }
.tick-flash-down { animation: fd 0.6s; }
@keyframes fu { 0% { background: rgba(240,68,82,0.18); } 100% { background: transparent; } }
@keyframes fd { 0% { background: rgba(49,130,246,0.18); } 100% { background: transparent; } }
.seg { display: flex; background: var(--input); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; height: 34px; border-radius: 10px; font-size: 13px; font-weight: 800; color: var(--sub); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.index-box { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.index-box b { font-size: 24px; font-weight: 900; }

/* ---------- 종목 상세 ---------- */
#detail { position: fixed; inset: 0; z-index: 20; max-width: 560px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; }
.d-head { padding: 16px 18px 6px; }
.d-name { font-size: 15px; color: var(--sub); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.d-price { font-size: 34px; font-weight: 900; letter-spacing: -0.5px; margin-top: 4px; }
.d-chg { font-size: 15px; font-weight: 800; margin-top: 2px; }
.d-note { font-size: 12px; color: var(--sub); margin-top: 6px; line-height: 1.5; }
.chart-wrap { position: relative; margin: 6px 0 0; }
.chart { width: 100%; height: 230px; display: block; touch-action: pan-y; }
.chart-tip { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--card); font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; pointer-events: none; white-space: nowrap; }
.chart-range { margin: 8px 14px 0; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; font-size: 14px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; }
.kv span { color: var(--sub); }
.kv b { font-weight: 800; }
.d-actions { display: flex; gap: 10px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
.d-actions .btn { flex: 1; }
.about { font-size: 14px; line-height: 1.7; color: var(--sub); }
.mine-box { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }

/* ---------- 뉴스 ---------- */
.news { padding: 14px 2px; border-bottom: 1px solid var(--line); }
.news:last-child { border-bottom: none; }
.news .meta { font-size: 12px; color: var(--sub); display: flex; gap: 8px; align-items: center; margin-bottom: 5px; flex-wrap: wrap; }
.news .tag { font-weight: 800; padding: 2px 7px; border-radius: 6px; background: var(--primary-light); color: var(--primary-deep); }
.news .tag.mkt { background: var(--input); color: var(--text); }
.news .hl { font-size: 15px; font-weight: 700; line-height: 1.5; }
.news.fresh .hl::before { content: "NEW "; color: var(--up); font-weight: 900; font-size: 12px; }

/* ---------- 주문 ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--card); border-radius: 24px 24px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; animation: up 0.2s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0.5; } }
.sheet h3 { font-size: 19px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.sheet h3 .spacer { flex: 1; }
.stepper { display: flex; align-items: center; background: var(--input); border-radius: 14px; height: 54px; }
.stepper button { width: 54px; height: 54px; font-size: 24px; font-weight: 700; color: var(--sub); }
.stepper input { flex: 1; min-width: 0; text-align: center; border: none; background: none; font-size: 19px; font-weight: 800; outline: none; }
.stepper input:disabled { color: var(--sub); }
.row-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--sub); font-weight: 700; margin-bottom: -6px; }
.quick { display: flex; gap: 6px; }
.quick button { flex: 1; height: 34px; border-radius: 10px; background: var(--input); font-size: 13px; font-weight: 800; color: var(--sub); }
.summary { background: var(--input); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.summary div { display: flex; justify-content: space-between; }
.summary span { color: var(--sub); }
.summary .total { font-size: 17px; font-weight: 900; padding-top: 6px; border-top: 1px dashed var(--line); }
.hint { font-size: 12px; color: var(--sub); line-height: 1.6; }
.order-row { display: flex; align-items: center; gap: 10px; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.order-row:last-child { border-bottom: none; }
.order-row .side { font-weight: 900; width: 34px; }
.order-row .info { flex: 1; min-width: 0; }
.order-row .info b { font-weight: 800; }
.order-row .info div { font-size: 12px; color: var(--sub); margin-top: 2px; }
.mini-btn { height: 32px; padding: 0 12px; border-radius: 9px; background: var(--input); font-size: 13px; font-weight: 800; color: var(--sub); }
.toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 90; background: rgba(31,26,20,0.92); color: #fff; padding: 12px 20px; border-radius: 22px; font-size: 14px; font-weight: 700; max-width: 90%; text-align: center; }
.toast.ok { background: #1E9E5A; }
.toast.err { background: var(--up); }
.modal-center { align-items: center; padding: 20px; }
.modal-center .sheet { border-radius: 24px; max-width: 420px; }
.term { padding: 12px 0; border-bottom: 1px solid var(--line); }
.term b { font-size: 15px; }
.term p { font-size: 14px; color: var(--sub); line-height: 1.6; margin-top: 4px; }
textarea.field { height: 90px; padding: 12px 14px; resize: none; }
.diary { padding: 12px 0; border-bottom: 1px solid var(--line); }
.diary .meta { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
.diary p { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
.setting { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 700; width: 100%; text-align: left; }
.setting:last-child { border-bottom: none; }
.setting small { color: var(--sub); font-weight: 600; font-size: 13px; }
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="big-logo">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>

<!-- 계좌 저장: 온챗 Firebase (Realtime Database의 "onstock" 칸만 씀) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
try {
  const app = initializeApp({
    apiKey: "AIzaSyDtaB6Me_uGpgZaW6ca4p6NVk_TEbxO6IA",
    authDomain: "onchat-fc78e.firebaseapp.com",
    databaseURL: "https://onchat-fc78e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "onchat-fc78e",
    appId: "1:939252436157:web:d8a55283aa9c17fa6e3bd4",
  }, "onstock");
  const db = getDatabase(app);
  window.osRemote = {
    put: (path, v) => set(ref(db, "onstock/" + path), v),
    once: (path, cb) => onValue(ref(db, "onstock/" + path), (s) => cb(s.val()), (e) => cb(undefined, e), { onlyOnce: true }),
    listen: (path, cb) => onValue(ref(db, "onstock/" + path), (s) => cb(s.val())),
    connected: (cb) => onValue(ref(db, ".info/connected"), (s) => cb(s.val() === true)),
  };
  window.dispatchEvent(new Event("osremote-ready"));
} catch (e) {
  console.warn("계좌 서버 연결 실패", e);
}
</script>

<script>
"use strict";
/* =====================================================================
   On-stock 모의 투자
   - 가짜 회사 10개, 매일 열리는 시장 (평일 07:30~22:30, 주말·공휴일 09:30~23:30, 동시호가, 상·하한가 ±30%, 호가 단위). 2026-11-01 전 날짜는 진짜 한국거래소 시간표
   - 주가는 "날짜 + 시간"으로 정해지는 계산식이라 앱을 꺼 놔도 시장은 계속 움직임 (서버 필요 없음)
   - 계좌는 온챗 Firebase에 저장 → 어느 기기에서든 같은 계좌, 아빠는 구경하기
   ===================================================================== */
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {

    const minute = Math.floor(from + r() * (until - from));
    const roll = r();
    const positive = r() < 0.52;
    const sizeRoll = r();
    let mag = sizeRoll < 0.6 ? 0.008 + r() * 0.022 : sizeRoll < 0.9 ? 0.03 + r() * 0.05 : 0.08 + r() * 0.12;
    let item;
    if (roll < 0.14) {
      mag *= 0.45;
      item = { scope: "market", text: r.pick(NEWS.market[positive ? "pos" : "neg"]) };
    } else if (roll < 0.32) {
      const s = r.pick(SECTORS);
      mag *= 0.7;
      item = { scope: "sector", sector: s, text: r.pick(NEWS.sectorWide[positive ? "pos" : "neg"]).replace("{s}", s) };
    } else {
      const c = r.pick(COMPANIES);
      if (c.vol > 0.03) mag *= 1.35;
      if (c.vol < 0.013) mag *= 0.6;
      const pool = (r() < 0.5 ? NEWS[positive ? "sectorPos" : "sectorNeg"][c.sector] : null) || NEWS[positive ? "pos" : "neg"];
      item = { scope: "company", code: c.code, text: r.pick(pool).replace("{n}", c.name) };
      // 바이오 임상 결과는 크게
      if (/임상 3상 성공|임상 실패/.test(item.text)) mag = Math.max(mag, 0.14 + r() * 0.12);
    }
    item.id = `${date}-${i}`;
    item.date = date;
    item.minute = minute;
    item.impact = (positive ? 1 : -1) * mag;
    item.at = msAt(date, minute);
    list.push(item);
  }
  return list.sort((a, b) => a.minute - b.minute);
}

function buildDay(date) {
  if (dayCache.has(date)) return dayCache.get(date);
  const prev = date === EPOCH ? null : buildDay(prevTradingDay(date));
  const o = openMin(date);
  const N = dayLength(date);
  const news = newsOfDay(date);
  // 시장 전체 · 업종 흐름 (같은 날엔 모든 회사가 같이 영향)
  const rm = rng("MKT:" + date);
  const mktDay = rm.gauss() * 0.006;
  const mkt = Array.from({ length: N + 1 }, () => rm.gauss());
  const sec = {};
  for (const s of SECTORS) {
    const rs = rng("SEC:" + s + ":" + date);
    sec[s] = { day: rs.gauss() * 0.004, path: Array.from({ length: N + 1 }, () => rs.gauss()) };
  }
  const tDays = Math.max(0, (msAt(date, 0) - msAt(EPOCH, 0)) / 86400e3);
  const companies = {};
  for (const c of COMPANIES) {
    const r = rng(c.code + ":" + date);
    const prevClose = prev ? prev.companies[c.code].close : c.base;
    const up = upperLimit(prevClose), lo = lowerLimit(prevClose);
    // 회사마다 "적정 가격"이 있어서 너무 멀리 가면 천천히 돌아옴
    const anchor = c.base * Math.exp((c.trend / 365) * tDays);
    const pull = 0.03 * Math.log(anchor / prevClose);
    // 이 회사에 영향을 주는 뉴스
    const hits = news.filter((n) => n.scope === "market" || (n.scope === "sector" && n.sector === c.sector) || (n.scope === "company" && n.code === c.code))
      .map((n) => ({ minute: n.minute, impact: n.scope === "market" ? n.impact * c.beta : n.impact }));
    // 장 시작 전 뉴스 → 시가 갭
    let gap = r.gauss() * c.vol * 0.25 + pull * 0.3;
    for (const h of hits) if (h.minute < o) gap += h.impact;
    let p = Math.min(up, Math.max(lo, prevClose * Math.exp(gap)));
    const sigma = c.vol / Math.sqrt(N);
    const wM = 0.45, wS = 0.35, wI = Math.sqrt(Math.max(0, 1 - wM * wM - wS * wS));
    const drift = (pull * 0.7 + mktDay * c.beta + sec[c.sector].day) / N;
    const prices = new Float64Array(N + 1);
    prices[0] = p;
    // 뉴스 효과: 나온 순간 60% 튀고, 나머지 40%는 30분 동안 천천히
    const tail = new Float64Array(N + 1);
    const jump = new Float64Array(N + 1);
    for (const h of hits) {
      if (h.minute < o) continue;
      const k = Math.min(N, h.minute - o);
      jump[k] += h.impact * 0.6;
      for (let j = 1; j <= 30 && k + j <= N; j++) tail[k + j] += (h.impact * 0.4) / 30;
    }
    for (let i = 1; i <= N; i++) {
      const z = wM * mkt[i] * Math.min(1.4, c.beta) + wS * sec[c.sector].path[i] + wI * r.gauss();
      // 장 초반·막판은 조금 더 출렁임 (진짜처럼)
      const intraday = i < 30 ? 1.5 : i > N - 40 ? 1.2 : 1;
      p = p * Math.exp(drift + sigma * z * intraday + jump[i] + tail[i]);
      p = Math.min(up, Math.max(lo, p));
      prices[i] = p;
    }
    const tp = Array.from(prices, roundTick).map((v) => Math.min(up, Math.max(lo, v)));
    const contEnd = auctionMin(date) - o; // 마감 동시호가 시작 index
    const open = tp[0], close = tp[N];
    let high = open, low = open;
    for (let i = 0; i <= contEnd; i++) { if (tp[i] > high) high = tp[i]; if (tp[i] < low) low = tp[i]; }
    high = Math.max(high, close); low = Math.min(low, close);
    companies[c.code] = { prices, tp, prevClose, open, close, high, low, up, lo, contEnd };
  }
  const day = { date, open: o, N, news, companies };
  dayCache.set(date, day);
  return day;
}

// 지금 (또는 특정 시각) 가격
function quote(code, t = kst()) {
  const st = marketState(t);
  const sessionDate = lastSessionDate(t);
  const day = buildDay(sessionDate);
  const c = day.companies[code];
  const res = { code, prevClose: c.prevClose, up: c.up, lo: c.lo, open: c.open, high: c.high, low: c.low, close: c.close, expected: null, sessionDate };
  if (sessionDate !== t.date || st.phase === "after") {
    // 장 마감 후 / 휴장
    Object.assign(res, { price: c.close, high: c.high, low: c.low });
  } else if (st.phase === "before" || st.phase === "pre") {
    // 장 시작 전: 현재가 = 어제 종가, 동시호가 중엔 예상 시가 표시
    Object.assign(res, { price: c.prevClose, open: null, high: null, low: null, expected: st.phase === "pre" ? c.open : null });
  } else {
    const idx = Math.min(c.contEnd, t.min - day.open);
    const i0 = Math.floor(idx);
    const frac = idx - i0;
    let price;
    if (st.phase === "closing") {
      price = c.tp[c.contEnd];
      res.expected = c.close;
    } else {
      // 1분 안에서도 조금씩 움직이게 (2초 단위)
      const a = c.prices[i0], b = c.prices[Math.min(i0 + 1, day.N)];
      const wig = rng(code + ":" + t.date + ":" + Math.floor(t.min * 30)).gauss() * byCode[code].vol * 0.02;
      price = roundTick((a + (b - a) * frac) * (1 + wig));
      price = Math.min(c.up, Math.max(c.lo, price));
    }
    let hi = c.tp[0], lo = c.tp[0];
    for (let i = 0; i <= i0; i++) { if (c.tp[i] > hi) hi = c.tp[i]; if (c.tp[i] < lo) lo = c.tp[i]; }
    Object.assign(res, { price, high: Math.max(hi, price), low: Math.min(lo, price) });
  }
  res.change = res.price - res.prevClose;
  res.rate = res.change / res.prevClose;
  res.atUpper = res.price >= c.up;
  res.atLower = res.price <= c.lo;
  return res;
}

// 지금까지의 거래일 목록
function sessionDates(t = kst()) {
  const last = lastSessionDate(t);
  const out = [];
  let d = EPOCH;
  while (d <= last) { if (isTradingDay(d)) out.push(d); d = addDays(d, 1); }
  return out;
}
// 지금까지 나온 뉴스 (최신순)
function newsUntil(t = kst(), limitDays = 20) {
  const dates = sessionDates(t).slice(-limitDays);
  // 휴장일 아침에 나온 뉴스는 다음 거래일 것 → 오늘이 거래일이 아니면 오늘 뉴스 없음
  const out = [];
  for (const d of dates) for (const n of buildDay(d).news) if (n.at <= t.ms) out.push(n);
  if (isTradingDay(t.date) && !dates.includes(t.date)) for (const n of buildDay(t.date).news) if (n.at <= t.ms) out.push(n);
  return out.sort((a, b) => b.at - a.at);
}

/* ---------------- 수수료 · 세금 (게임 규칙, 진짜와 비슷하게) ---------------- */
const FEE_RATE = 0.00015; // 사고팔 때 0.015%
const TAX_RATE = 0.002;   // 팔 때 거래세 0.2%
const START_CASH = 5000000;
const feeOf = (amount) => Math.floor(amount * FEE_RATE);
const taxOf = (amount) => Math.floor(amount * TAX_RATE);

/* =====================================================================
   계좌
   ===================================================================== */
let acct = null;       // 지금 계좌
let viewer = false;    // 아빠 모드 (보기만)
let nickKey = "";
let saveTimer = null;

function blankAccount(nick, pinHash) {
  return { nick, pinHash, createdAt: nowMs(), cash: START_CASH, holdings: {}, orders: {}, trades: [], diary: [], divs: {}, lastSeenNews: 0 };
}
function normalize(a) {
  a.holdings = a.holdings || {};
  a.orders = a.orders || {};
  a.trades = Array.isArray(a.trades) ? a.trades : Object.values(a.trades || {});
  a.diary = Array.isArray(a.diary) ? a.diary : Object.values(a.diary || {});
  a.divs = a.divs || {};
  return a;
}
let savePending = false;
function saveAccount() {
  if (viewer || !acct) return;
  clearTimeout(saveTimer);
  savePending = true;
  saveTimer = setTimeout(() => {
    savePending = false;
    try { localStorage.setItem("onstock-acct:" + nickKey, JSON.stringify(acct)); } catch (e) { /* 괜찮음 */ }
    if (window.osRemote) window.osRemote.put("users/" + nickKey, JSON.parse(JSON.stringify(acct))).catch((e) => console.warn("저장 실패", e));
  }, 150);
}
async function sha(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
const keyOf = (nick) => nick.trim().toLowerCase();

// 주문 때문에 묶인 돈 / 주식
function reservedCash() {
  let sum = 0;
  for (const o of Object.values(acct.orders)) if (o.status === "open" && o.side === "buy") sum += o.reserve || 0;
  return sum;
}
function reservedQty(code) {
  let q = 0;
  for (const o of Object.values(acct.orders)) if (o.status === "open" && o.side === "sell" && o.code === code) q += o.qty;
  return q;
}
const availableCash = () => acct.cash - reservedCash();
const heldQty = (code) => (acct.holdings[code] ? acct.holdings[code].qty : 0);
const sellableQty = (code) => heldQty(code) - reservedQty(code);

function applyFill(o, price, at) {
  const amount = price * o.qty;
  const fee = feeOf(amount);
  const tax = o.side === "sell" ? taxOf(amount) : 0;
  const h = acct.holdings[o.code] || { qty: 0, cost: 0 };
  let realized = 0;
  if (o.side === "buy") {
    acct.cash -= amount + fee;
    h.qty += o.qty;
    h.cost += amount + fee;
  } else {
    const avg = h.qty ? h.cost / h.qty : 0;
    acct.cash += amount - fee - tax;
    realized = amount - fee - tax - avg * o.qty;
    h.cost -= avg * o.qty;
    h.qty -= o.qty;
  }
  if (h.qty > 0) acct.holdings[o.code] = h;
  else delete acct.holdings[o.code];
  o.status = "filled";
  o.fillPrice = price;
  o.filledAt = at;
  delete o.reserve;
  acct.trades.push({ id: o.id, code: o.code, side: o.side, qty: o.qty, price, fee, tax, at, realized: Math.round(realized) });
  if (acct.trades.length > 400) acct.trades = acct.trades.slice(-400);
  return { amount, fee, tax, realized };
}

/* 미체결 주문 처리: 주문 낸 시각부터 지금까지 가격을 훑어서 체결 여부 결정 */
function processOrders(t = kst(), silent = false) {
  if (!acct) return [];
  const filled = [];
  for (const o of Object.values(acct.orders)) {
    if (o.status !== "open") continue;
    const day = buildDay(o.day);
    const c = day.companies[o.code];
    const ok = (p) => o.type === "market" || (o.side === "buy" ? p <= o.price : p >= o.price);
    const orderMin = (o.placedAt - msAt(o.day, 0)) / 60e3;
    const nowMin = t.date === o.day ? t.min : t.date > o.day ? 24 * 60 : -1;
    let fill = null;
    // ① 장 시작 전 동시호가에 낸 주문 → 시가에 체결
    if (o.session === "pre" && nowMin >= day.open) {
      if (ok(c.open)) fill = { price: c.open, at: msAt(o.day, day.open) };
      else o.session = "cont";
    }
    // ② 장 중: 주문 뒤 1분마다 가격 확인 (마감 동시호가 전까지)
    if (!fill && o.session === "cont" && o.type === "limit") {
      const from = Math.max(1, Math.ceil(orderMin - day.open + 0.0001));
      const to = Math.min(c.contEnd, Math.floor(nowMin - day.open));
      for (let i = from; i <= to; i++) {
        const p = c.tp[i];
        if (ok(p)) {
          fill = { price: o.price, at: msAt(o.day, day.open + i) };
          break;
        }
      }
    }
    // ③ 마감 동시호가 → 종가에 체결, 안 되면 주문 만료
    if (!fill && nowMin >= closeMin(o.day)) {
      if (ok(c.close)) fill = { price: c.close, at: msAt(o.day, closeMin(o.day)) };
      else {
        o.status = "expired";
        delete o.reserve;
        filled.push({ o, expired: true });
        continue;
      }
    }
    if (fill) {
      // 돈이 모자라면 (다른 주문이 먼저 체결된 경우) 취소
      if (o.side === "buy" && acct.cash < fill.price * o.qty + feeOf(fill.price * o.qty)) {
        o.status = "canceled";
        o.note = "잔고 부족";
        delete o.reserve;
        continue;
      }
      applyFill(o, fill.price, fill.at);
      filled.push({ o });
    }
  }
  const divs = payDividends(t);
  if (filled.length || divs) saveAccount();
  if (!silent) {
    for (const f of filled) {
      const c = byCode[f.o.code];
      if (f.expired) toast(`⌛ ${c.name} ${f.o.side === "buy" ? "매수" : "매도"} 주문이 장 마감으로 취소됐어요`);
      else toast(`✅ ${c.name} ${f.o.qty}주 ${f.o.side === "buy" ? "매수" : "매도"} 체결 (${won(f.o.fillPrice)})`, "ok");
    }
  }
  return filled;
}

/* 배당: 3·6·9·12월 마지막 거래일에 갖고 있던 주식만큼, 다음 거래일 아침에 입금 */
function qtyAt(code, atMs) {
  let q = 0;
  for (const tr of acct.trades) if (tr.code === code && tr.at <= atMs) q += tr.side === "buy" ? tr.qty : -tr.qty;
  return q;
}
function dividendDates(t = kst()) {
  const out = [];
  for (const d of sessionDates(t)) {
    const n = nextTradingDay(d); // 지급일 (아직 안 왔을 수도 있음 → 아래에서 시간 확인)
    const m = Number(d.slice(5, 7));
    if ([3, 6, 9, 12].includes(m) && n.slice(5, 7) !== d.slice(5, 7)) out.push({ record: d, pay: n });
  }
  return out;
}
function payDividends(t = kst()) {
  let paid = 0;
  for (const { record, pay } of dividendDates(t)) {
    if (msAt(pay, openMin(pay)) > t.ms) continue;
    if (msAt(record, closeMin(record)) < acct.createdAt) continue;
    for (const c of COMPANIES) {
      if (!c.dps) continue;
      const key = `${c.code}@${record}`;
      if (acct.divs[key] != null) continue;
      const q = qtyAt(c.code, msAt(record, closeMin(record)));
      const amt = q > 0 ? q * c.dps : 0;
      acct.divs[key] = amt;
      if (amt > 0) {
        acct.cash += amt;
        paid += amt;
        toast(`💰 ${c.name} 배당금 ${won(amt)} 입금 (${q}주 × ${won(c.dps)})`, "ok");
      }
    }
  }
  return paid;
}

/* 주문 넣기 */
function placeOrder({ code, side, type, price, qty }) {
  const t = kst();
  const st = marketState(t);
  if (!["pre", "open", "closing"].includes(st.phase)) {
    return { err: st.phase === "holiday" ? "오늘은 휴장일이라 주문할 수 없어요" : "지금은 주문 시간이 아니에요 (평일 07:00~22:30 · 주말·공휴일 09:00~23:30)" };
  }
  qty = Math.floor(qty);
  if (!(qty > 0)) return { err: "수량을 1주 이상 넣어 주세요" };
  const q = quote(code, t);
  if (type === "limit") {
    if (!(price > 0)) return { err: "가격을 넣어 주세요" };
    if (price % tickSize(price) !== 0) return { err: `이 가격대는 ${fmt(tickSize(price))}원 단위로만 주문할 수 있어요 (호가 단위)` };
    if (price > q.up || price < q.lo) return { err: `오늘은 ${won(q.lo)} ~ ${won(q.up)} 사이로만 주문할 수 있어요 (상·하한가)` };
  }
  const session = st.phase === "pre" ? "pre" : st.phase === "closing" ? "close" : "cont";
  const id = "o" + t.ms.toString(36) + Math.random().toString(36).slice(2, 6);
  const o = { id, code, side, type, price: type === "limit" ? price : null, qty, placedAt: t.ms, day: t.date, session, status: "open" };
  // 사는 주문은 돈을 미리 묶어 둠 (시장가는 상한가 기준)
  if (side === "buy") {
    const base = type === "limit" ? price : session === "cont" ? q.price : q.up;
    const need = base * qty + feeOf(base * qty);
    if (need > availableCash()) return { err: `주문 가능 금액이 부족해요 (가능: ${won(availableCash())})` };
    o.reserve = need;
  } else if (qty > sellableQty(code)) {
    return { err: `팔 수 있는 주식이 ${sellableQty(code)}주예요` };
  }
  acct.orders[id] = o;
  // 장 중 시장가 → 바로 체결 / 지정가인데 지금 가격으로 바로 되면 지금 가격에 체결
  if (session === "cont" && (type === "market" || (side === "buy" ? q.price <= price : q.price >= price))) {
    const r = applyFill(o, q.price, t.ms);
    saveAccount();
    return { filled: true, price: q.price, ...r };
  }
  saveAccount();
  return { queued: true, session };
}
function cancelOrder(id) {
  const o = acct.orders[id];
  if (!o || o.status !== "open") return;
  o.status = "canceled";
  delete o.reserve;
  saveAccount();
}

/* 평가 */
function portfolio(t = kst()) {
  let value = 0, cost = 0;
  const rows = [];
  for (const [code, h] of Object.entries(acct.holdings)) {
    const q = quote(code, t);
    const v = q.price * h.qty;
    value += v;
    cost += h.cost;
    rows.push({ code, qty: h.qty, avg: h.cost / h.qty, price: q.price, value: v, pl: v - h.cost, rate: (v - h.cost) / h.cost, dayRate: q.rate });
  }
  const total = acct.cash + value;
  return { cash: acct.cash, value, cost, total, pl: total - START_CASH, rate: (total - START_CASH) / START_CASH, rows: rows.sort((a, b) => b.value - a.value) };
}
// 날짜별 총 자산 (거래 기록으로 다시 계산)
function assetHistory(t = kst()) {
  const dates = sessionDates(t).filter((d) => msAt(d, closeMin(d)) >= acct.createdAt - 86400e3);
  const out = [];
  for (const d of dates) {
    const cut = d === t.date ? t.ms : msAt(d, closeMin(d));
    let cash = START_CASH;
    const qty = {};
    for (const tr of acct.trades) {
      if (tr.at > cut) continue;
      const amt = tr.price * tr.qty;
      if (tr.side === "buy") { cash -= amt + tr.fee; qty[tr.code] = (qty[tr.code] || 0) + tr.qty; }
      else { cash += amt - tr.fee - tr.tax; qty[tr.code] = (qty[tr.code] || 0) - tr.qty; }
    }
    for (const [k, v] of Object.entries(acct.divs)) {
      const rec = k.split("@")[1];
      if (v && msAt(nextTradingDay(rec), openMin(nextTradingDay(rec))) <= cut) cash += v;
    }
    let val = 0;
    for (const [code, q] of Object.entries(qty)) if (q > 0) val += q * (d === t.date ? quote(code, t).price : buildDay(d).companies[code].close);
    out.push({ date: d, total: cash + val });
  }
  return out;
}

/* ---------- 차트 ---------- */
function setupCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || cv.parentElement.clientWidth || 320;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w, h };
}
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function drawSpark(cv, values, base) {
  const { g, w, h } = setupCanvas(cv, cv.clientHeight || 30);
  if (values.length < 2) return;
  const all = values.concat(base != null ? [base] : []);
  const mn = Math.min(...all), mx = Math.max(...all);
  const y = (v) => (mx === mn ? h / 2 : h - 2 - ((v - mn) / (mx - mn)) * (h - 4));
  const last = values[values.length - 1];
  g.strokeStyle = last > (base ?? values[0]) ? css("--up") : last < (base ?? values[0]) ? css("--down") : css("--sub");
  g.lineWidth = 1.6;
  g.beginPath();
  values.forEach((v, i) => { const x = (i / (values.length - 1)) * w; i ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); });
  g.stroke();
  if (base != null) {
    g.setLineDash([2, 3]); g.strokeStyle = css("--line"); g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, y(base)); g.lineTo(w, y(base)); g.stroke(); g.setLineDash([]);
  }
}

// 하루 선 차트 (분 단위) 또는 캔들 (일 단위)
function drawChart(cv, tip, mode, code) {
  const H = 230;
  const { g, w, h } = setupCanvas(cv, H);
  const t = kst();
  const padL = 6, padR = 58, padT = 14, padB = 22;
  const W = w - padL - padR, HH = h - padT - padB;
  g.clearRect(0, 0, w, h);
  g.font = "11px -apple-system, sans-serif";
  const up = css("--up"), down = css("--down"), sub = css("--sub"), line = css("--line");
  let points = [], base = null, mn, mx, labels = [];
  if (mode === "1d") {
    const d = lastSessionDate(t);
    const day = buildDay(d);
    const c = day.companies[code];
    base = c.prevClose;
    let to = day.N;
    if (d === t.date) {
      const st = marketState(t);
      if (st.phase === "before" || st.phase === "pre") to = -1;
      else if (st.phase === "open") to = Math.floor(t.min - day.open);
      else if (st.phase === "closing") to = c.contEnd;
    }
    for (let i = 0; i <= to; i++) points.push({ v: c.tp[i], label: hm(day.open + i) });
    if (d === t.date && marketState(t).phase === "open" && points.length) points.push({ v: quote(code, t).price, label: hm(t.min) });
    const vals = points.map((p) => p.v).concat([base]);
    mn = Math.min(...vals); mx = Math.max(...vals);
    const totalSlots = day.N;
    const x = (i) => padL + (i / totalSlots) * W;
    const y = (v) => padT + (mx === mn ? HH / 2 : (1 - (v - mn) / (mx - mn)) * HH);
    // 기준선 (어제 종가)
    g.setLineDash([3, 4]); g.strokeStyle = sub; g.lineWidth = 1;
    g.beginPath(); g.moveTo(padL, y(base)); g.lineTo(padL + W, y(base)); g.stroke(); g.setLineDash([]);
    g.fillStyle = sub; g.fillText(fmt(base), padL + W + 6, y(base) + 4);
    if (!points.length) {
      g.fillStyle = sub; g.textAlign = "center";
      g.fillText("오늘 장이 아직 열리지 않았어요", padL + W / 2, padT + HH / 2);
      g.textAlign = "left";
    } else {
      const last = points[points.length - 1].v;
      const col = last > base ? up : last < base ? down : sub;
      const grad = g.createLinearGradient(0, padT, 0, padT + HH);
      grad.addColorStop(0, col + "33"); grad.addColorStop(1, col + "00");
      g.beginPath();
      points.forEach((p, i) => { const xx = x(Math.min(i, totalSlots)); i ? g.lineTo(xx, y(p.v)) : g.moveTo(xx, y(p.v)); });
      g.strokeStyle = col; g.lineWidth = 2; g.stroke();
      g.lineTo(x(Math.min(points.length - 1, totalSlots)), padT + HH); g.lineTo(x(0), padT + HH); g.closePath();
      g.fillStyle = grad; g.fill();
      g.fillStyle = col; g.beginPath(); g.arc(x(Math.min(points.length - 1, totalSlots)), y(last), 3.5, 0, Math.PI * 2); g.fill();
      g.fillText(fmt(mx), padL + W + 6, padT + 4);
      g.fillText(fmt(mn), padL + W + 6, padT + HH);
    }
    g.fillStyle = sub;
    g.fillText(hm(day.open), padL, h - 6);
    g.textAlign = "right"; g.fillText(hm(day.open + day.N), padL + W, h - 6); g.textAlign = "left";
    labels = { x, y, count: points.length, slots: totalSlots };
  } else {
    const back = addDays(t.date, mode === "1m" ? -31 : mode === "3m" ? -92 : -366);
    const dates = sessionDates(t).filter((d) => d > back);
    const candles = dates.map((d) => {
      const c = buildDay(d).companies[code];
      if (d === t.date) {
        const q = quote(code, t);
        return { d, o: q.open ?? q.price, h: q.high ?? q.price, l: q.low ?? q.price, c: q.price };
      }
      return { d, o: c.open, h: c.high, l: c.low, c: c.close };
    });
    points = candles.map((k) => ({ v: k.c, label: `${k.d.slice(5).replace("-", "/")} 종가 ${fmt(k.c)}`, k }));
    mn = Math.min(...candles.map((k) => k.l)); mx = Math.max(...candles.map((k) => k.h));
    const cw = W / Math.max(candles.length, 1);
    const x = (i) => padL + cw * i + cw / 2;
    const y = (v) => padT + (mx === mn ? HH / 2 : (1 - (v - mn) / (mx - mn)) * HH);
    candles.forEach((k, i) => {
      const col = k.c >= k.o ? up : down;
      g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x(i), y(k.h)); g.lineTo(x(i), y(k.l)); g.stroke();
      const bw = Math.max(1.5, cw * 0.62);
      const top = y(Math.max(k.o, k.c)), bot = y(Math.min(k.o, k.c));
      g.fillRect(x(i) - bw / 2, top, bw, Math.max(1, bot - top));
    });
    g.fillStyle = sub;
    g.fillText(fmt(mx), padL + W + 6, padT + 4);
    g.fillText(fmt(mn), padL + W + 6, padT + HH);
    if (candles.length) {
      g.fillText(candles[0].d.slice(5).replace("-", "/"), padL, h - 6);
      g.textAlign = "right"; g.fillText(candles[candles.length - 1].d.slice(5).replace("-", "/"), padL + W, h - 6); g.textAlign = "left";
    }
    labels = { x, y, count: candles.length, slots: candles.length - 1, candle: true };
  }
  // 손가락/마우스로 짚으면 가격 보기
  cv.onpointermove = cv.onpointerdown = (e) => {
    if (!points.length) return;
    const rect = cv.getBoundingClientRect();
    const px = e.clientX - rect.left;
    let i;
    if (labels.candle) i = Math.floor(((px - padL) / W) * labels.count);
    else i = Math.round(((px - padL) / W) * labels.slots);
    i = Math.max(0, Math.min(points.length - 1, i));
    const p = points[i];
    tip.textContent = labels.candle ? `${p.label} · 고 ${fmt(p.k.h)} 저 ${fmt(p.k.l)}` : `${p.label} · ${fmt(p.v)}원`;
    tip.classList.remove("hidden");
  };
  cv.onpointerleave = () => tip.classList.add("hidden");
}

function renderMore() {
  const box = $("tab-more");
  box.replaceChildren();
  // 투자 일기
  const c1 = el("div", "card");
  const h1 = el("h3");
  h1.append(document.createTextNode("📝 투자 일기"), el("div", "spacer"));
  if (!viewer) {
    const add = el("button", "link", "+ 쓰기");
    add.type = "button";
    add.onclick = () => writeDiary();
    h1.append(add);
  }
  c1.append(h1);
  c1.append(el("div", "hint", "왜 샀는지, 왜 팔았는지 적어 두면 나중에 결과랑 비교하면서 배울 수 있어요."));
  const diary = acct.diary.slice().sort((a, b) => b.at - a.at);
  if (!diary.length) c1.append(el("div", "empty", "아직 일기가 없어요"));
  for (const dItem of diary.slice(0, 50)) {
    const dv = el("div", "diary");
    const at = new Date(dItem.at + 9 * 3600e3);
    let meta = `${at.getUTCMonth() + 1}/${at.getUTCDate()} ${String(at.getUTCHours()).padStart(2, "0")}:${String(at.getUTCMinutes()).padStart(2, "0")}`;
    if (dItem.code) {
      const then = dItem.price, nowP = quote(dItem.code).price;
      meta += ` · ${byCode[dItem.code].name} (그때 ${fmt(then)} → 지금 ${fmt(nowP)}, ${pct((nowP - then) / then)})`;
    }
    dv.append(el("div", "meta", meta), el("p", null, dItem.text));
    c1.append(dv);
  }
  box.append(c1);
  // 용어
  const c2 = el("div", "card");
  c2.append(Object.assign(el("h3"), { textContent: "🎓 주식 용어 사전" }));
  for (const [k, v] of TERMS) {
    const tm = el("div", "term");
    tm.append(el("b", null, k), el("p", null, v));
    c2.append(tm);
  }
  box.append(c2);
  // 설정
  const c3 = el("div", "card");
  c3.append(Object.assign(el("h3"), { textContent: "⚙️ 설정" }));
  const info = el("div", "setting");
  info.append(el("span", null, viewer ? "구경 중인 계좌" : "내 닉네임"), el("small", null, acct.nick));
  c3.append(info);
  const rules = el("button", "setting");
  rules.type = "button";
  rules.append(el("span", null, "시장 규칙 보기"), el("small", null, "›"));
  rules.onclick = showRules;
  c3.append(rules);
  if (!viewer) {
    const reset = el("button", "setting");
    reset.type = "button";
    reset.append(el("span", null, "계좌 처음부터 다시 시작"), el("small", null, "500만 원으로"));
    reset.style.color = "var(--up)";
    reset.onclick = () => openSheet((sh) => {
      sh.append(el("h3", null, "계좌를 처음부터 다시 할까요?"), el("div", "hint", "주식, 주문, 거래 기록이 모두 지워지고 500만 원으로 다시 시작해요. 투자 일기는 남아요."));
      const row = el("div", "quick");
      const no = el("button", null, "아니요"), yes = el("button", null, "다시 시작");
      yes.style.cssText = "background:var(--up);color:#fff";
      no.onclick = closeSheet;
      yes.onclick = () => {
        const diaryKeep = acct.diary;
        acct = blankAccount(acct.nick, acct.pinHash);
        acct.diary = diaryKeep;
        saveAccount();
        closeSheet();
        toast("500만 원으로 다시 시작했어요", "ok");
        renderAll();

      sh.append(row);

    c3.append(reset);

  out.type = "button";

  out.onclick = logout;
  c3.append(out);
  box.append(c3);
}

function writeDiary(code) {
  openSheet((sh) => {
    sh.append(el("h3", null, code ? `📝 ${byCode[code].name} 메모` : "📝 투자 일기"));
    const ta = el("textarea", "field");
    ta.placeholder = code ? "왜 샀어(팔았어)? 앞으로 어떻게 될 것 같아?" : "오늘 시장은 어땠어? 무엇을 배웠어?";
    ta.maxLength = 500;
    sh.append(ta);
    const save = el("button", "btn block", "저장");
    save.type = "button";
    save.onclick = () => {
      const text = ta.value.trim();
      if (!text) return toast("내용을 적어 주세요", "err");
      acct.diary.push({ id: "d" + nowMs().toString(36), at: nowMs(), code: code || null, price: code ? quote(code).price : null, text });
      saveAccount();
      closeSheet();
      toast("일기를 저장했어요", "ok");
      renderAll();
    };
    sh.append(save);
    setTimeout(() => ta.focus(), 100);
  }, true);
}

/* ---------- 종목 상세 ---------- */
let detailCode = null;
let chartMode = "1d";
function openDetail(code) {
  detailCode = code;
  chartMode = "1d";
  $("detail").classList.remove("hidden");
  $("d-actions").classList.toggle("hidden", viewer);
  renderDetail(true);
}
$("d-back").addEventListener("click", () => {
  detailCode = null;
  $("detail").classList.add("hidden");
  renderAll();
});
function renderDetail(full) {
  if (!detailCode) return;
  const c = byCode[detailCode];
  const t = kst();
  const q = quote(detailCode, t);
  const st = marketState(t);
  $("d-title").textContent = c.name;
  const body = $("d-body");
  if (!full && body.querySelector(".d-price")) {
    // 가격 부분만 새로
    body.querySelector(".d-price").textContent = won(q.price);
    body.querySelector(".d-price").className = "d-price num " + cls(q.change);
    body.querySelector(".d-chg").textContent = `${arrow(q.change)} ${fmt(Math.abs(q.change))}원 (${pct(q.rate)})`;
    body.querySelector(".d-chg").className = "d-chg num " + cls(q.change);
    fillKv(body.querySelector(".kv"), q);
    fillMine(body.querySelector("#d-mine"), q);
    body.querySelector(".d-note").textContent = noteFor(q, st);
    drawChart(body.querySelector(".chart"), body.querySelector(".chart-tip"), chartMode, detailCode);
    return;
  }
  body.replaceChildren();
  const head = el("div", "d-head");
  const nm = el("div", "d-name");
  nm.append(logoBox(c, 28), document.createTextNode(`${c.code} · ${c.sector}`));
  head.append(nm, el("div", "d-price num " + cls(q.change), won(q.price)), el("div", "d-chg num " + cls(q.change), `${arrow(q.change)} ${fmt(Math.abs(q.change))}원 (${pct(q.rate)})`), el("div", "d-note", noteFor(q, st)));
  body.append(head);
  const wrap = el("div", "chart-wrap");
  const cv = el("canvas", "chart");
  const tip = el("div", "chart-tip hidden");
  wrap.append(cv, tip);
  body.append(wrap);
  const seg = el("div", "seg chart-range");
  [["1d", "1일"], ["1m", "1개월"], ["3m", "3개월"], ["1y", "1년"]].forEach(([k, label]) => {
    const b = el("button", chartMode === k ? "on" : "", label);
    b.type = "button";
    b.onclick = () => { chartMode = k; renderDetail(true); };
    seg.append(b);
  });
  body.append(seg);
  // 내 보유
  const mine = el("div", "card");
  mine.id = "d-mine";
  body.append(mine);
  fillMine(mine, q);
  // 시세 정보
  const info = el("div", "card");
  info.append(Object.assign(el("h3"), { textContent: "시세" }));
  const kv = el("div", "kv");
  info.append(kv);
  fillKv(kv, q);
  body.append(info);
  // 회사 소개
  const about = el("div", "card");
  about.append(Object.assign(el("h3"), { textContent: "회사 소개" }), el("div", "about", c.about));
  if (c.dps) about.append(el("div", "hint", `💰 배당: 3개월마다 1주당 ${won(c.dps)} (1년 ${won(c.dps * 4)} · 지금 가격 기준 연 ${((c.dps * 4) / q.price * 100).toFixed(1)}%)`));
  body.append(about);
  // 관련 뉴스
  const nc = el("div", "card");
  nc.append(Object.assign(el("h3"), { textContent: "관련 뉴스" }));
  const rel = newsUntil(t).filter((n) => n.code === c.code || (n.scope === "sector" && n.sector === c.sector)).slice(0, 8);
  if (!rel.length) nc.append(el("div", "empty", "최근 관련 뉴스가 없어요"));
  for (const n of rel) {
    const item = el("div", "news");
    const dt = new Date(n.at + 9 * 3600e3);
    item.append(el("div", "meta", `${dt.getUTCMonth() + 1}/${dt.getUTCDate()} ${hm(n.minute)}`), el("div", "hl", n.text));
    nc.append(item);
  }
  body.append(nc);
  if (!viewer) {
    const memo = el("button", "btn ghost", "📝 이 종목 메모 쓰기");
    memo.type = "button";
    memo.style.cssText = "margin:12px 14px 0;width:calc(100% - 28px)";
    memo.onclick = () => writeDiary(c.code);
    body.append(memo);
  }
  requestAnimationFrame(() => drawChart(cv, tip, chartMode, detailCode));
}
function noteFor(q, st) {
  if (st.phase === "pre") return `동시호가 중이에요. 예상 시가 ${won(q.expected)} (${pct((q.expected - q.prevClose) / q.prevClose)}) · ${hm(openMin(st.date))}에 한꺼번에 체결돼요`;
  if (st.phase === "closing") return `마감 동시호가 중이에요. 예상 종가 ${won(q.expected)} · ${hm(closeMin(st.date))}에 한꺼번에 체결돼요`;
  if (st.phase === "before") return `장 시작 전이에요. 현재가는 어제 종가예요 · ${nextOpenText()}`;
  if (st.phase === "after" || st.phase === "holiday") return `장이 끝났어요. 현재가는 ${q.sessionDate.slice(5).replace("-", "/")} 종가예요 · 다음 장: ${nextOpenText()}`;
  if (q.atUpper) return "🔥 상한가! 오늘은 더 오를 수 없어요";
  if (q.atLower) return "💧 하한가! 오늘은 더 내릴 수 없어요";
  return "실시간으로 움직이고 있어요";
}
function fillKv(kv, q) {
  kv.replaceChildren();
  const cell = (k, v, c) => { const d = el("div"); d.append(el("span", null, k), el("b", "num " + (c || ""), v)); kv.append(d); };
  cell("시가", q.open != null ? fmt(q.open) : "-");
  cell("전일 종가", fmt(q.prevClose));
  cell("고가", q.high != null ? fmt(q.high) : "-", q.high > q.prevClose ? "up" : "");
  cell("저가", q.low != null ? fmt(q.low) : "-", q.low != null && q.low < q.prevClose ? "down" : "");
  cell("상한가", fmt(q.up), "up");
  cell("하한가", fmt(q.lo), "down");
  cell("호가 단위", fmt(tickSize(q.price)) + "원");
  cell("예상 체결가", q.expected != null ? fmt(q.expected) : "-");
}
function fillMine(box, q) {
  box.replaceChildren();
  const h = acct.holdings[detailCode];
  box.append(Object.assign(el("h3"), { textContent: viewer ? "보유 현황" : "내 주식" }));
  if (!h) {
    box.append(el("div", "hint", viewer ? "이 종목은 갖고 있지 않아요" : `아직 없어요. 주문 가능 금액 ${won(availableCash())}로 최대 ${fmt(Math.floor(availableCash() / (q.price * (1 + FEE_RATE))))}주 살 수 있어요.`));
    return;
  }
  const avg = h.cost / h.qty, val = q.price * h.qty, pl = val - h.cost;
  const kv = el("div", "kv");
  const cell = (k, v, c) => { const d = el("div"); d.append(el("span", null, k), el("b", "num " + (c || ""), v)); kv.append(d); };
  cell("보유 수량", `${fmt(h.qty)}주`);
  cell("평단", fmt(avg));
  cell("평가 금액", fmt(val));
  cell("평가 손익", signWon(pl), cls(pl));
  cell("수익률", pct(pl / h.cost), cls(pl));
  cell("팔 수 있는 수량", `${fmt(sellableQty(detailCode))}주`);
  box.append(kv);
}

/* ---------- 주문 창 ---------- */
$("d-buy").addEventListener("click", () => openOrder("buy"));
$("d-sell").addEventListener("click", () => openOrder("sell"));
function openOrder(side) {
  const code = detailCode;
  const c = byCode[code];
  const st = marketState();
  if (!["pre", "open", "closing"].includes(st.phase)) {
    openSheet((sh) => {
      sh.append(el("h3", null, "지금은 주문할 수 없어요 🕘"), el("div", "hint", `${st.label} · 주문은 평일 07:00~22:30, 주말·공휴일 09:00~23:30에 할 수 있어요.\n다음 장: ${nextOpenText()}`));
      sh.lastChild.style.whiteSpace = "pre-line";
      const ok = el("button", "btn block", "확인");
      ok.onclick = closeSheet;
      sh.append(ok);
    }, true);
    return;
  }
  let type = st.phase === "open" ? "market" : "limit";
  let q = quote(code);
  let price = q.expected || q.price;
  let qty = side === "sell" ? Math.min(1, sellableQty(code)) : 1;
  openSheet((sh) => {
    const h = el("h3");
    h.append(logoBox(c, 30), document.createTextNode(`${c.name} ${side === "buy" ? "사기" : "팔기"}`), el("div", "spacer"));
    const close = el("button", "icon-btn", "✕");
    close.onclick = closeSheet;
    h.append(close);
    sh.append(h);
    const seg = el("div", "seg");
    const bMarket = el("button", null, "시장가"), bLimit = el("button", null, "지정가");
    seg.append(bMarket, bLimit);
    sh.append(seg);
    const typeHint = el("div", "hint");
    sh.append(typeHint);
    const priceLabel = el("div", "row-label");
    sh.append(priceLabel);
    const priceStep = el("div", "stepper");
    const pMinus = el("button", null, "−"), pInput = el("input"), pPlus = el("button", null, "+");
    pInput.inputMode = "numeric";
    priceStep.append(pMinus, pInput, pPlus);
    sh.append(priceStep);
    const qtyLabel = el("div", "row-label");
    sh.append(qtyLabel);
    const qtyStep = el("div", "stepper");
    const qMinus = el("button", null, "−"), qInput = el("input"), qPlus = el("button", null, "+");
    qInput.inputMode = "numeric";
    qtyStep.append(qMinus, qInput, qPlus);
    sh.append(qtyStep);
    const quick = el("div", "quick");
    [["10%", 0.1], ["25%", 0.25], ["50%", 0.5], ["최대", 1]].forEach(([label, r]) => {
      const b = el("button", null, label);
      b.type = "button";
      b.onclick = () => { qty = Math.max(0, Math.floor(maxQty() * r)); sync(); };
      quick.append(b);
    });
    sh.append(quick);
    const sum = el("div", "summary num");
    sh.append(sum);
    const go = el("button", "btn block " + (side === "buy" ? "buy" : "sell"));
    go.type = "button";
    sh.append(go);
    const foot = el("div", "hint");
    sh.append(foot);

    const unitPrice = () => (type === "market" ? (st.phase === "open" ? q.price : q.expected || q.price) : price);
    function maxQty() {
      if (side === "sell") return sellableQty(code);
      const p = type === "market" ? (st.phase === "open" ? q.price : q.up) : price;
      return p > 0 ? Math.floor(availableCash() / (p * (1 + FEE_RATE))) : 0;
    }
    function sync() {
      q = quote(code);
      bMarket.classList.toggle("on", type === "market");
      bLimit.classList.toggle("on", type === "limit");
      const isMarket = type === "market";
      typeHint.textContent = isMarket
        ? (st.phase === "open" ? "지금 가격에 바로 체결돼요." : st.phase === "pre" ? `${hm(openMin(st.date))} 시가에 체결돼요. (돈은 상한가 기준으로 잠깐 묶여요)` : `${hm(closeMin(st.date))} 종가에 체결돼요. (돈은 상한가 기준으로 잠깐 묶여요)`)
        : `원하는 가격을 정해요. ${side === "buy" ? "그 가격 이하로 내려오면" : "그 가격 이상으로 오르면"} 체결되고, 오늘 장이 끝나면 사라져요.`;
      priceLabel.replaceChildren(el("span", null, "가격"), el("span", null, `현재가 ${fmt(q.price)} · 호가 단위 ${fmt(tickSize(price || q.price))}원`));
      pInput.disabled = isMarket;
      pMinus.disabled = pPlus.disabled = isMarket;
      pInput.value = isMarket ? "시장가" : fmt(price);
      qty = Math.max(0, Math.min(qty, Math.max(maxQty(), 0)));
      qtyLabel.replaceChildren(el("span", null, "수량"), el("span", null, `${side === "buy" ? "최대" : "팔 수 있는"} ${fmt(maxQty())}주`));
      qInput.value = fmt(qty);
      const up = unitPrice();
      const amount = up * qty;
      const fee = feeOf(amount);
      const tax = side === "sell" ? taxOf(amount) : 0;
      sum.replaceChildren();
      const line = (k, v, c2) => { const d = el("div", c2); d.append(el("span", null, k), el("b", null, v)); sum.append(d); };
      line(`${isMarket ? "예상 " : ""}주문 금액`, won(amount));
      line("수수료 (0.015%)", won(fee));
      if (side === "sell") line("거래세 (0.2%)", won(tax));
      if (side === "sell" && heldQty(code)) {
        const h2 = acct.holdings[code];
        const pl = amount - fee - tax - (h2.cost / h2.qty) * qty;
        line("예상 손익", signWon(pl));
        sum.lastChild.lastChild.className = cls(pl);
      }
      line(side === "buy" ? "필요한 돈" : "받을 돈", won(side === "buy" ? amount + fee : amount - fee - tax), "total");
      go.textContent = `${fmt(qty)}주 ${side === "buy" ? "사기" : "팔기"}`;
      go.disabled = qty <= 0;
      foot.textContent = side === "buy" ? `주문 가능 금액 ${won(availableCash())}` : `보유 ${fmt(heldQty(code))}주 (주문 중 ${fmt(reservedQty(code))}주)`;
    }
    bMarket.onclick = () => { type = "market"; sync(); };
    bLimit.onclick = () => { type = "limit"; price = price || q.price; sync(); };
    // 장 시작 전 동시호가에도 시장가 가능 (시가에 체결)
    pMinus.onclick = () => { price = Math.max(q.lo, price - tickSize(price - 1)); sync(); };
    pPlus.onclick = () => { price = Math.min(q.up, price + tickSize(price)); sync(); };
    pInput.onchange = () => {
      let v = Number(pInput.value.replace(/\D/g, "")) || 0;
      v = Math.min(q.up, Math.max(q.lo, roundTick(v)));
      price = v;
      sync();
    };
    qMinus.onclick = () => { qty = Math.max(0, qty - 1); sync(); };
    qPlus.onclick = () => { qty += 1; if (qty > maxQty()) { qty = maxQty(); toast(side === "buy" ? "돈이 부족해요" : "갖고 있는 주식이 부족해요", "err"); } sync(); };
    qInput.onchange = () => { qty = Number(qInput.value.replace(/\D/g, "")) || 0; sync(); };
    go.onclick = () => {
      const r = placeOrder({ code, side, type, price, qty });
      if (r.err) return toast(r.err, "err");
      closeSheet();
      if (r.filled) {
        toast(`✅ ${c.name} ${fmt(qty)}주 ${side === "buy" ? "매수" : "매도"} 체결 (${won(r.price)})${side === "sell" ? ` · 손익 ${signWon(r.realized)}` : ""}`, "ok");
      } else {
        toast(r.session === "pre" ? `📝 주문 접수! ${hm(openMin(kst().date))} 시가에 체결돼요` : r.session === "close" ? `📝 주문 접수! ${hm(closeMin(kst().date))} 종가에 체결돼요` : "📝 주문 접수! 가격이 오면 체결돼요");
      }
      renderAll();
    };
    sync();
  });
}

/* ---------- 탭 ---------- */
document.querySelectorAll("#tabbar button").forEach((b) =>
  b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll("#tabbar button").forEach((x) => x.classList.toggle("on", x === b));
    for (const k of ["home", "market", "news", "orders", "more"]) $("tab-" + k).classList.toggle("hidden", k !== tab);
    renderTab();
    $("tab-" + tab).scrollTop = 0;
  })
);
function renderTab() {
  if (!acct) return;
  ({ home: renderHome, market: renderMarket, news: renderNews, orders: renderOrders, more: renderMore })[tab]();
  updateDots();
}
function updateDots() {
  if (!acct) return;
  const t = kst();
  const fresh = newsUntil(t, 3).filter((n) => n.at > (acct.lastSeenNews || 0)).length;
  $("news-dot").textContent = fresh > 9 ? "9+" : fresh;
  $("news-dot").classList.toggle("hidden", !fresh || viewer);
  const open = Object.values(acct.orders).filter((o) => o.status === "open").length;
  $("order-dot").textContent = open;
  $("order-dot").classList.toggle("hidden", !open);
}
function renderAll() {
  renderTop();
  renderTab();
  if (detailCode) renderDetail(true);
}

/* ---------- 계속 움직이게 (2초마다) ---------- */
let loop = null;
let lastPhase = "";
function startLoop() {
  clearInterval(loop);
  loop = setInterval(() => {
    if (!acct) return;
    renderTop();
    const t = kst();
    const phase = marketState(t).phase;
    if (!viewer) processOrders(t);
    if (document.hidden) return;
    // 화면이 바뀌는 탭만 다시 그림
    if (detailCode) renderDetail(false);
    else if (tab === "market" || tab === "home" || phase !== lastPhase) renderTab();
    else updateDots();
    lastPhase = phase;
  }, 2000);
}

/* =====================================================================
   로그인
   ===================================================================== */
function waitRemote(timeout = 6000) {
  return new Promise((res) => {
    if (window.osRemote) return res(true);
    const t = setTimeout(() => res(false), timeout);
    window.addEventListener("osremote-ready", () => { clearTimeout(t); res(true); }, { once: true });
  });
}
function readOnce(path) {
  return new Promise((res) => window.osRemote.once(path, (v, err) => res({ v, err })));
}
function validNick(n) {
  return /^[0-9A-Za-z가-힣_]{2,12}$/.test(n);
}
async function doLogin(asViewer) {
  const nick = $("l-nick").value.trim();
  const pin = $("l-pin").value.trim();
  $("l-msg").textContent = "";
  if (!validNick(nick)) return ($("l-msg").textContent = "닉네임은 한글·영어·숫자 2~12자로 해 주세요");
  if (!asViewer && !/^\d{4}$/.test(pin)) return ($("l-msg").textContent = "비밀번호는 숫자 4자리예요");
  const btn = asViewer ? $("l-view") : $("l-go");
  btn.disabled = true;
  try {
    const ok = await waitRemote();
    if (!ok) throw new Error("서버에 연결하지 못했어요. 인터넷을 확인해 주세요");
    const key = keyOf(nick);
    const { v, err } = await readOnce("users/" + key);
    if (err) throw new Error("서버 권한이 없어요 (Firebase 규칙을 확인해 주세요)");
    if (asViewer) {
      if (!v) throw new Error("그런 닉네임의 계좌가 없어요");
      enter(key, normalize(v), true);
      return;
    }
    const pinHash = await sha(key + ":" + pin);
    if (!v) {
      const a = blankAccount(nick, pinHash);
      nickKey = key;
      acct = a;
      await window.osRemote.put("users/" + key, JSON.parse(JSON.stringify(a)));
      toast(`🎉 계좌를 만들었어요! 500만 원으로 시작해요`, "ok");
      enter(key, a, false);
      return;
    }
    if (v.pinHash !== pinHash) throw new Error("비밀번호가 맞지 않아요");
    enter(key, normalize(v), false);
  } catch (e) {
    $("l-msg").textContent = e.message || "문제가 생겼어요";
  } finally {
    btn.disabled = false;
  }
}
$("l-go").addEventListener("click", () => doLogin(false));
$("l-view").addEventListener("click", () => doLogin(true));
$("l-pin").addEventListener("keydown", (e) => e.key === "Enter" && doLogin(false));

let unlisten = null;
function enter(key, a, asViewer) {
  nickKey = key;
  acct = a;
  viewer = asViewer;
  try { localStorage.setItem("onstock-session", JSON.stringify({ key, viewer: asViewer, pinHash: asViewer ? null : a.pinHash })); } catch (e) { /* 괜찮음 */ }
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("viewer-bar").classList.toggle("hidden", !viewer);
  $("viewer-bar").textContent = `👀 ${a.nick}님 계좌를 구경 중이에요 (주문은 못 해요)`;
  // 다른 기기(또는 본인)에서 바뀌면 바로 반영
  if (unlisten) unlisten();
  unlisten = window.osRemote.listen("users/" + key, (v) => {
    if (!v) return;
    if (!viewer && v.pinHash !== acct.pinHash) return;
    if (!viewer && savePending) return; // 아직 저장 안 한 내 변경이 있으면 덮어쓰지 않음
    acct = normalize(v);
    if (viewer) renderAll();
  });
  if (!viewer) processOrders(kst(), true);
  renderAll();
  startLoop();
}
function logout() {
  if (unlisten) unlisten();
  unlisten = null;
  clearInterval(loop);
  acct = null;
  viewer = false;
  detailCode = null;
  try { localStorage.removeItem("onstock-session"); } catch (e) { /* 괜찮음 */ }
  $("detail").classList.add("hidden");
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("l-pin").value = "";
}

// 자동 로그인
(async function autoLogin() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem("onstock-session")); } catch (e) { s = null; }
  if (!s || !s.key) return;
  if (!(await waitRemote())) return;
  const { v } = await readOnce("users/" + s.key);
  if (!v) return;
  if (!s.viewer && v.pinHash !== s.pinHash) return;
  enter(s.key, normalize(v), !!s.viewer);
})();

window.addEventListener("resize", () => acct && renderAll());

// 홈 화면 앱 (PWA)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch((e) => console.warn("서비스 워커 등록 실패", e));
}
</script>
